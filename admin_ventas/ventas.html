<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración </title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Panel de Ventas </h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="index.html"><i></i> Panel Principal</a></li>
                <li><a href="ventas.html"><i></i> Ventas</a></li>
                <li><a href="citas.html"><i></i>Citas </a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="header">
                
                <div class="user-info">
                    <img src="https://via.placeholder.com/40" alt="Usuario">
                    <span>Administrador</span>
                </div>
            </div>

            <!-- Sales Table -->
            <div class="sales-table-container">
                <div class="table-header">
                    <div class="table-title">Historial de Ventas</div>
                    <div class="table-actions">
                        <button class="btn btn-primary" id="export-btn">Exportar</button>
                        <button class="btn btn-primary" id="refresh-btn">Actualizar</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID Venta</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Productos</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="sales-table-body">
                        <!-- Las filas se llenarán con JavaScript -->
                    </tbody>
                </table>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
