<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Citas</title>
    <link rel="stylesheet" href="styles.css">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
    <script>
        // 🔒 PROTECCIÓN DE RUTA: Solo administradores
        const usuarioGuardado = localStorage.getItem('usuario');
        if (!usuarioGuardado) {
            window.location.href = '../Inicio de Sesion/index.html';
        } else {
            const usuario = JSON.parse(usuarioGuardado);
            if (usuario.rol !== 'admin') {
                alert('⛔ Acceso denegado. Solo administradores.');
                window.location.href = '../index.html';
            }
        }
    </script>
    
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Panel Principal</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="index.html"><i></i> Panel Principal</a></li>
                <li><a href="ventas.html"><i></i> Ventas</a></li>
                <li><a href="citas.html" class="active"><i></i>Citas </a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            
            <div class="header">
                
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Cliente</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="citas-table-body">
                        <!-- Las filas se llenarán con JavaScript -->
                        <tr>
                            <td colspan="7" style="text-align: center;">Cargando citas...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div style="margin-top: 40px; text-align: center; padding-bottom: 20px;">
                <a href="../index.html" class="btn-primary"
                    style="text-decoration: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; background-color: #3498db; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    🏠 Volver al Inicio
                </a>
            </div>
        </div>
    </div>

    <!-- Script específico para citas -->
    <script src="../config.js"></script>
    <script src="citas.js"></script>
</body>

</html>
